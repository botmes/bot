name: Build TikTok Live Helper IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          mkdir -p Payload/TikTokTool.app
          
          # 1. Tạo file cấu hình Info.plist
          cat << 'EOF' > Payload/TikTokTool.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.tiktok.livehelper</string>
              <key>CFBundleName</key>
              <string>TikTokTool</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>TikTokTool</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

          # 2. Tạo mã nguồn Objective-C tích hợp Floating Menu & Sync Live Buffer
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>

          @interface MainViewController : UIViewController <WKNavigationDelegate>
          @property (nonatomic, strong) WKWebView *webView;
          @property (nonatomic, strong) UIView *floatingMenu;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, assign) CGPoint initialCenter;
          @end

          @implementation MainViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor blackColor];

              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              config.allowsInlineMediaPlayback = YES;
              config.mediaTypesRequiringUserActionForPlayback = WKAudiovisualMediaTypeNone;

              self.webView = [[WKWebView alloc] initWithFrame:self.view.bounds configuration:config];
              self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.webView.navigationDelegate = self;
              
              NSURL *url = [NSURL URLWithString:@"https://www.tiktok.com/live"];
              [self.webView loadRequest:[NSURLRequest requestWithURL:url]];
              [self.view addSubview:self.webView];

              [self setupFloatingMenu];
          }

          - (void)setupFloatingMenu {
              CGFloat menuW = 270;
              CGFloat menuH = 210;
              
              self.floatingMenu = [[UIView alloc] initWithFrame:CGRectMake(20, 90, menuW, menuH)];
              self.floatingMenu.backgroundColor = [[UIColor colorWithRed:0.08 green:0.08 blue:0.1 alpha:0.92] colorWithAlphaComponent:0.92];
              self.floatingMenu.layer.cornerRadius = 16;
              self.floatingMenu.layer.borderWidth = 1.5;
              self.floatingMenu.layer.borderColor = [UIColor colorWithRed:1.0 green:0.18 blue:0.33 alpha:0.8].CGColor;
              self.floatingMenu.clipsToBounds = YES;

              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(handlePan:)];
              [self.floatingMenu addGestureRecognizer:pan];

              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, menuW, 35)];
              title.text = @"⚡ TIKTOK LIVE ACCELERATOR";
              title.textColor = [UIColor whiteColor];
              title.font = [UIFont boldSystemFontOfSize:13];
              title.textAlignment = NSTextAlignmentCenter;
              title.backgroundColor = [UIColor colorWithRed:0.15 green:0.15 blue:0.18 alpha:1.0];
              [self.floatingMenu addSubview:title];

              self.statusLabel = [[UILabel alloc] initWithFrame:CGRectMake(10, 40, menuW - 20, 22)];
              self.statusLabel.text = @"Trạng thái: 1.0x (Gốc)";
              self.statusLabel.textColor = [UIColor systemGreenColor];
              self.statusLabel.font = [UIFont systemFontOfSize:12 weight:UIFontWeightMedium];
              self.statusLabel.textAlignment = NSTextAlignmentCenter;
              [self.floatingMenu addSubview:self.statusLabel];

              NSArray *speeds = @[@"1.0x", @"1.25x", @"1.5x", @"2.0x"];
              CGFloat btnW = (menuW - 50) / 4;
              for (NSInteger i = 0; i < speeds.count; i++) {
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
                  btn.frame = CGRectMake(10 + i * (btnW + 8), 68, btnW, 32);
                  [btn setTitle:speeds[i] forState:UIControlStateNormal];
                  [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  btn.backgroundColor = [UIColor colorWithRed:0.2 green:0.2 blue:0.25 alpha:1.0];
                  btn.titleLabel.font = [UIFont boldSystemFontOfSize:12];
                  btn.layer.cornerRadius = 6;
                  btn.tag = i;
                  [btn addTarget:self action:@selector(changeSpeed:) forControlEvents:UIControlEventTouchUpInside];
                  [self.floatingMenu addSubview:btn];
              }

              UIButton *syncBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              syncBtn.frame = CGRectMake(10, 110, menuW - 20, 38);
              [syncBtn setTitle:@"⏩ Tua Đến Đầu Live (Xóa Trễ Buffer)" forState:UIControlStateNormal];
              [syncBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              syncBtn.backgroundColor = [UIColor colorWithRed:0.9 green:0.1 blue:0.3 alpha:1.0];
              syncBtn.titleLabel.font = [UIFont boldSystemFontOfSize:12];
              syncBtn.layer.cornerRadius = 8;
              [syncBtn addTarget:self action:@selector(syncToLiveEdge) forControlEvents:UIControlEventTouchUpInside];
              [self.floatingMenu addSubview:syncBtn];

              UIButton *turboBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              turboBtn.frame = CGRectMake(10, 156, menuW - 20, 38);
              [turboBtn setTitle:@"🚀 Bật Chế Độ Càn Tốc (Ép Live 1.5x)" forState:UIControlStateNormal];
              [turboBtn setTitleColor:[UIColor blackColor] forState:UIControlStateNormal];
              turboBtn.backgroundColor = [UIColor colorWithRed:0.0 green:0.9 blue:0.8 alpha:1.0];
              turboBtn.titleLabel.font = [UIFont boldSystemFontOfSize:12];
              turboBtn.layer.cornerRadius = 8;
              [turboBtn addTarget:self action:@selector(enableTurboMode) forControlEvents:UIControlEventTouchUpInside];
              [self.floatingMenu addSubview:turboBtn];

              [self.view addSubview:self.floatingMenu];
          }

          - (void)handlePan:(UIPanGestureRecognizer *)pan {
              CGPoint translation = [pan translationInView:self.view];
              if (pan.state == UIGestureRecognizerStateBegan) {
                  self.initialCenter = self.floatingMenu.center;
              }
              if (pan.state == UIGestureRecognizerStateBegan || pan.state == UIGestureRecognizerStateChanged) {
                  self.floatingMenu.center = CGPointMake(self.initialCenter.x + translation.x, self.initialCenter.y + translation.y);
              }
          }

          - (void)changeSpeed:(UIButton *)sender {
              NSArray *rates = @[@1.0, @1.25, @1.5, @2.0];
              float rate = [rates[sender.tag] floatValue];
              
              NSString *js = [NSString stringWithFormat:@"var v = document.querySelector('video'); if(v){ v.playbackRate = %.2f; }", rate];
              [self.webView evaluateJavaScript:js completionHandler:nil];
              
              self.statusLabel.text = [NSString stringWithFormat:@"Trạng thái: Tốc độ %.2fx", rate];
          }

          - (void)syncToLiveEdge {
              NSString *js = @"var v = document.querySelector('video'); if(v && v.buffered.length > 0){ v.currentTime = v.buffered.end(v.buffered.length - 1) - 0.05; v.play(); }";
              [self.webView evaluateJavaScript:js completionHandler:nil];
              self.statusLabel.text = @"⚡ Đã tua sát thời gian thực!";
          }

          - (void)enableTurboMode {
              NSString *js = @"var v = document.querySelector('video'); if(v){ v.playbackRate = 1.5; v.play(); }";
              [self.webView evaluateJavaScript:js completionHandler:nil];
              self.statusLabel.text = @"🚀 Đã ép phát nhanh 1.5x!";
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[MainViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # 3. Biên dịch Native ARM64 bằng Clang chính xác với SDK iOS
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDKPATH" \
            -fobjc-arc -framework UIKit -framework Foundation -framework WebKit \
            main.m -o Payload/TikTokTool.app/TikTokTool

          # 4. Đóng gói file IPA
          zip -r TikTokTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokTool-IPA
          path: TikTokTool.ipa
