import SwiftUI

struct ContentView: View {
    @State private var phase = 0
    @State private var penOffset: CGSize = CGSize(width: -300, height: 100)
    @State private var textProgress: CGFloat = 0.0
    @State private var heartProgress: CGFloat = 0.0
    @State private var showFireworks = false
    
    var body: some View {
        ZStack {
            // 1. Nền bầu trời đêm Trung Thu
            LinearGradient(gradient: Gradient(colors: [Color(red: 0.05, green: 0.05, blue: 0.2), .black]), startPoint: .top, endPoint: .bottom)
                .ignoresSafeArea()
            
            // Mặt trăng
            Circle()
                .fill(Color.yellow.opacity(0.8))
                .frame(width: 150, height: 150)
                .shadow(color: .yellow, radius: 20, x: 0, y: 0)
                .position(x: UIScreen.main.bounds.width - 100, y: 100)
            
            // 2. Lồng đèn Trung Thu (Hiện ra sau khi vẽ xong)
            if phase >= 3 {
                HStack(spacing: 80) {
                    LanternView(color: .red)
                    LanternView(color: .orange)
                    Spacer()
                    LanternView(color: .yellow)
                    LanternView(color: .red)
                }
                .padding(.top, -50)
                .transition(.move(edge: .top).combined(with: .opacity))
            }
            
            VStack(spacing: 20) {
                // 3. Chữ "love Thuỳ"
                Text("love Thuỳ")
                    .font(.custom("Chalkboard SE", size: 60).italic()) // Font chữ mềm mại
                    .foregroundColor(.white)
                    .shadow(color: .pink, radius: 5, x: 0, y: 0)
                    .mask(
                        Rectangle()
                            .frame(width: UIScreen.main.bounds.width * textProgress, height: 100)
                            .offset(x: UIScreen.main.bounds.width * (textProgress - 1) / 2)
                    )
                
                // 4. Trái tim màu hồng
                HeartShape()
                    .trim(from: 0, to: heartProgress)
                    .stroke(Color.pink, style: StrokeStyle(lineWidth: 6, lineCap: .round, lineJoin: .round))
                    .frame(width: 150, height: 150)
                    .shadow(color: .pink, radius: 10, x: 0, y: 0)
            }
            .offset(y: 50)
            
            // 5. Cây bút thần di chuyển
            if phase < 3 {
                Image(systemName: "wand.and.stars") // Icon cây bút/đũa phép
                    .font(.system(size: 50))
                    .foregroundColor(.yellow)
                    .shadow(color: .yellow, radius: 10)
                    .rotationEffect(.degrees(135))
                    .offset(penOffset)
            }
            
            // 6. Pháo hoa mang tên Thuỳ
            if showFireworks {
                FireworkEffectView(name: "Thuỳ")
            }
        }
        .onAppear {
            startMagicAnimation()
        }
    }
    
    func startMagicAnimation() {
        // Bước 1: Bút chạy ra và viết chữ
        withAnimation(.easeInOut(duration: 2.5)) {
            textProgress = 1.0
            penOffset = CGSize(width: 150, height: -20)
        }
        
        // Bước 2: Bút di chuyển xuống vẽ trái tim
        DispatchQueue.main.asyncAfter(deadline: .now() + 2.5) {
            withAnimation(.easeInOut(duration: 0.5)) {
                penOffset = CGSize(width: 0, height: 150)
            }
            
            DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) {
                withAnimation(.easeInOut(duration: 2.0)) {
                    heartProgress = 1.0
                    // Bút lượn vòng theo trái tim (mô phỏng)
                    penOffset = CGSize(width: 0, height: 250)
                }
                
                // Bước 3: Bút biến mất, hiện lồng đèn và bắn pháo hoa
                DispatchQueue.main.asyncAfter(deadline: .now() + 2.2) {
                    withAnimation {
                        phase = 3
                        showFireworks = true
                    }
                }
            }
        }
    }
}

// MARK: - Shape Trái Tim
struct HeartShape: Shape {
    func path(in rect: CGRect) -> Path {
        var path = Path()
        let width = rect.width
        let height = rect.height
        
        path.move(to: CGPoint(x: width / 2, y: height * 0.25))
        path.addCurve(to: CGPoint(x: width, y: height * 0.25),
                      control1: CGPoint(x: width * 0.75, y: 0),
                      control2: CGPoint(x: width, y: height * 0.1))
        path.addCurve(to: CGPoint(x: width / 2, y: height),
                      control1: CGPoint(x: width, y: height * 0.6),
                      control2: CGPoint(x: width / 2, y: height * 0.8))
        path.addCurve(to: CGPoint(x: 0, y: height * 0.25),
                      control1: CGPoint(x: width / 2, y: height * 0.8),
                      control2: CGPoint(x: 0, y: height * 0.6))
        path.addCurve(to: CGPoint(x: width / 2, y: height * 0.25),
                      control1: CGPoint(x: 0, y: height * 0.1),
                      control2: CGPoint(x: width * 0.25, y: 0))
        return path
    }
}

// MARK: - Component Lồng Đèn Trung Thu
struct LanternView: View {
    var color: Color
    @State private var swing = false
    
    var body: some View {
        VStack(spacing: 0) {
            Rectangle().fill(Color.orange).frame(width: 4, height: 40) // Dây treo
            Capsule()
                .fill(color)
                .frame(width: 50, height: 70)
                .overlay(
                    Capsule().stroke(Color.yellow, lineWidth: 2)
                )
                .shadow(color: color, radius: 15)
            Rectangle().fill(Color.yellow).frame(width: 10, height: 20) // Đuôi lồng đèn
        }
        .rotationEffect(.degrees(swing ? 5 : -5), anchor: .top)
        .onAppear {
            withAnimation(Animation.easeInOut(duration: 1.5).repeatForever(autoreverses: true)) {
                swing.toggle()
            }
        }
    }
}

// MARK: - Hiệu ứng Pháo Hoa chứa tên
struct FireworkEffectView: View {
    var name: String
    @State private var explode = false
    
    var body: some View {
        ZStack {
            // Hạt pháo hoa toả ra
            ForEach(0..<40, id: \.self) { i in
                Circle()
                    .fill(Color.randomPinkOrYellow())
                    .frame(width: 8, height: 8)
                    .offset(x: explode ? CGFloat.random(in: -200...200) : 0,
                            y: explode ? CGFloat.random(in: -200...200) : 0)
                    .opacity(explode ? 0 : 1)
                    .animation(Animation.easeOut(duration: 1.5).delay(0.2).repeatForever(autoreverses: false), value: explode)
            }
            
            // Tên "Thuỳ" toả sáng giữa pháo hoa
            Text(name)
                .font(.system(size: 80, weight: .bold, design: .rounded))
                .foregroundColor(.yellow)
                .shadow(color: .pink, radius: 20, x: 0, y: 0)
                .scaleEffect(explode ? 1.5 : 0.1)
                .opacity(explode ? 1 : 0)
                .animation(Animation.spring(response: 0.6, dampingFraction: 0.5).delay(0.2), value: explode)
        }
        .onAppear {
            explode = true
        }
    }
}

// Tiện ích màu ngẫu nhiên cho pháo hoa
extension Color {
    static func randomPinkOrYellow() -> Color {
        let colors: [Color] = [.pink, .yellow, .red, .orange, .white]
        return colors.randomElement() ?? .pink
    }
}
