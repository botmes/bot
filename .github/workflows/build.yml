name: Build Sunset Chill Scene IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Scene Background
        run: |
          mkdir -p Payload/SunsetRacer.app
          # Tải hình ảnh scene hoàng hôn chill làm nền chính
          curl -sL "https://png.pngtree.com/background/20230519/original/pngtree-anime-couple-sitting-in-a-cabin-overlooking-the-sunset-picture-image_2667104.jpg" -o Payload/SunsetRacer.app/bg.jpg

      - name: Compile and Package Chill Scene IPA
        run: |
          # 1. Tạo Info.plist chuẩn iOS bằng Python
          python3 -c "
          import plistlib
          plist = {
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleExecutable': 'SunsetRacer',
              'CFBundleIdentifier': 'com.devnvios.sunsetracer3d',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': 'SunsetChill',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': '2.0',
              'CFBundleVersion': '2',
              'LSRequiresIPhoneOS': True,
              'UIRequiresFullScreen': True,
              'UIStatusBarHidden': True,
              'UISupportedInterfaceOrientations': [
                  'UIInterfaceOrientationLandscapeRight',
                  'UIInterfaceOrientationLandscapeLeft'
              ],
              'UIRequiredDeviceCapabilities': ['arm64'],
              'CADisableMinimumFrameDurationOnPhone': True
          }
          with open('Payload/SunsetRacer.app/Info.plist', 'wb') as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_BINARY)
          "

          printf "APPL????" > Payload/SunsetRacer.app/PkgInfo

          # 2. Tạo Mã Nguồn Live Animation Scene chuẩn Objective-C
          cat << 'ENDOFCODE' > main.m
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <AVFoundation/AVFoundation.h>

          @interface ChillViewController : UIViewController
          @property (nonatomic, strong) UIImageView *backgroundView;
          @property (nonatomic, strong) CAEmitterLayer *dustEmitter;
          @property (nonatomic, strong) CAEmitterLayer *smokeEmitter;
          @end

          @implementation ChillViewController

          - (BOOL)prefersStatusBarHidden { return YES; }
          - (BOOL)prefersHomeIndicatorAutoHidden { return YES; }
          - (UIInterfaceOrientationMask)supportedInterfaceOrientations {
              return UIInterfaceOrientationMaskLandscape;
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor blackColor];

              // 1. Hiển thị Ảnh nền Hoàng Hôn Chill
              NSString *bgPath = [[NSBundle mainBundle] pathForResource:@"bg" ofType:@"jpg"];
              UIImage *bgImage = [UIImage imageWithContentsOfFile:bgPath];
              
              self.backgroundView = [[UIImageView alloc] initWithFrame:self.view.bounds];
              self.backgroundView.contentMode = UIViewContentModeScaleAspectFill;
              self.backgroundView.image = bgImage;
              self.backgroundView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:self.backgroundView];

              // 2. Chuyển động camera đung đưa nhẹ tạo cảm giác sống động (Parallax Effect)
              [self setupGentleSwayAnimation];

              // 3. Tạo hiệu ứng hạt bụi nắng lấp lánh (Sunbeam Dust Particles)
              [self setupDustParticles];

              // 4. Tạo hiệu ứng khói bốc nhẹ từ tách trà/cà phê
              [self setupCoffeeSmoke];

              // 5. Phủ hiệu ứng ánh sáng nắng ấm áp đung đưa (Sunset Glow Pulse)
              [self setupSunsetGlow];
          }

          - (void)setupGentleSwayAnimation {
              // Chuyển động zoom nhẹ nhấp nhô theo nhịp thở của nhân vật
              CABasicAnimation *sway = [CABasicAnimation animationWithKeyPath:@"transform.scale"];
              sway.duration = 5.0;
              sway.fromValue = @(1.0);
              sway.toValue = @(1.03);
              sway.autoreverses = YES;
              sway.repeatCount = HUGE_VALF;
              sway.timingFunction = [CAMediaTimingFunction functionWithName:kCAMediaTimingFunctionEaseInEaseOut];
              [self.backgroundView.layer addAnimation:sway forKey:@"gentleBreath"];
          }

          - (void)setupDustParticles {
              self.dustEmitter = [CAEmitterLayer layer];
              self.dustEmitter.emitterPosition = CGPointMake(self.view.bounds.size.width / 2, self.view.bounds.size.height / 2);
              self.dustEmitter.emitterSize = self.view.bounds.size;
              self.dustEmitter.emitterShape = kCAEmitterLayerRectangle;

              CAEmitterCell *dust = [CAEmitterCell emitterCell];
              dust.birthRate = 10;
              dust.lifetime = 12.0;
              dust.velocity = 12;
              dust.velocityRange = 8;
              dust.emissionRange = M_PI * 2;
              dust.scale = 0.08;
              dust.scaleRange = 0.04;
              dust.alphaSpeed = -0.05;
              dust.color = [UIColor colorWithRed:1.0 green:0.85 blue:0.4 alpha:0.7].CGColor;

              // Tạo hình tròn hạt bụi
              UIGraphicsBeginImageContext(CGSizeMake(16, 16));
              CGContextRef ctx = UIGraphicsGetCurrentContext();
              CGContextSetFillColorWithColor(ctx, [UIColor whiteColor].CGColor);
              CGContextFillEllipseInRect(ctx, CGRectMake(0, 0, 16, 16));
              UIImage *particleImg = UIGraphicsGetImageFromCurrentImageContext();
              UIGraphicsEndImageContext();

              dust.contents = (__bridge id)[particleImg CGImage];
              self.dustEmitter.emitterCells = @[dust];
              [self.view.layer addSublayer:self.dustEmitter];
          }

          - (void)setupCoffeeSmoke {
              self.smokeEmitter = [CAEmitterLayer layer];
              // Tọa độ ly cà phê của nhân vật nữ
              self.smokeEmitter.emitterPosition = CGPointMake(self.view.bounds.size.width * 0.67, self.view.bounds.size.height * 0.62);
              self.smokeEmitter.emitterSize = CGSizeMake(8, 8);

              CAEmitterCell *smokeCell = [CAEmitterCell emitterCell];
              smokeCell.birthRate = 5;
              smokeCell.lifetime = 3.5;
              smokeCell.velocity = -18;
              smokeCell.emissionLongitude = -M_PI_2;
              smokeCell.emissionRange = M_PI / 8;
              smokeCell.scale = 0.06;
              smokeCell.scaleSpeed = 0.05;
              smokeCell.alphaSpeed = -0.25;
              smokeCell.color = [UIColor colorWithWhite:1.0 alpha:0.3].CGColor;

              UIGraphicsBeginImageContext(CGSizeMake(20, 20));
              CGContextRef ctx = UIGraphicsGetCurrentContext();
              CGContextSetFillColorWithColor(ctx, [UIColor whiteColor].CGColor);
              CGContextFillEllipseInRect(ctx, CGRectMake(0, 0, 20, 20));
              UIImage *smokeImg = UIGraphicsGetImageFromCurrentImageContext();
              UIGraphicsEndImageContext();

              smokeCell.contents = (__bridge id)[smokeImg CGImage];
              self.smokeEmitter.emitterCells = @[smokeCell];
              [self.view.layer addSublayer:self.smokeEmitter];
          }

          - (void)setupSunsetGlow {
              UIView *glowView = [[UIView alloc] initWithFrame:self.view.bounds];
              glowView.backgroundColor = [UIColor colorWithRed:1.0 green:0.45 blue:0.1 alpha:0.12];
              glowView.userInteractionEnabled = NO;
              glowView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:glowView];

              CABasicAnimation *pulse = [CABasicAnimation animationWithKeyPath:@"opacity"];
              pulse.duration = 3.5;
              pulse.fromValue = @(0.2);
              pulse.toValue = @(0.7);
              pulse.autoreverses = YES;
              pulse.repeatCount = HUGE_VALF;
              [glowView.layer addAnimation:pulse forKey:@"sunsetPulse"];
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[ChillViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          ENDOFCODE

          # 3. Biên dịch bằng Clang
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -w \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -framework AVFoundation \
            main.m -o Payload/SunsetRacer.app/SunsetRacer

          # 4. Đóng gói IPA
          zip -r SunsetRacer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunsetChill-Scene-IPA
          path: SunsetRacer.ipa
