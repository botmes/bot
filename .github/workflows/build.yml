name: Build Modded LangSoi IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Azule Injection Tool
        run: |
          git clone https://github.com/Al45tair/Azule.git
          sudo ln -sf $(pwd)/Azule/azule /usr/local/bin/azule

      - name: Compile Mod Menu Dylib (AdBlock & Auto-Reward)
        run: |
          cat << 'EOF' > ModLangSoi.m
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          // ----------------------------------------------------
          // 1. BIẾN TRẠNG THÁI CÔNG TẮC
          // ----------------------------------------------------
          static BOOL g_BlockInterstitials = YES;
          static BOOL g_AutoClaimRewards = YES;

          // ----------------------------------------------------
          // 2. GIAO DIỆN MOD MENU RỜI (FLOATING MENU UI)
          // ----------------------------------------------------
          @interface ModMenuView : UIView
          @property (nonatomic, strong) UIButton *toggleBtn;
          @property (nonatomic, strong) UIView *panelView;
          @property (nonatomic, assign) BOOL isExpanded;
          @end

          @implementation ModMenuView

          - (instancetype)init {
              CGRect screen = [UIScreen mainScreen].bounds;
              self = [super initWithFrame:CGRectMake(20, screen.size.height / 3, 50, 50)];
              if (self) {
                  self.isExpanded = NO;

                  // Icon Nút Tròn Nổi
                  self.toggleBtn = [UIButton buttonWithType:UIButtonTypeCustom];
                  self.toggleBtn.frame = CGRectMake(0, 0, 50, 50);
                  self.toggleBtn.layer.cornerRadius = 25;
                  self.toggleBtn.backgroundColor = [UIColor colorWithRed:0.35 green:0.10 blue:0.55 alpha:0.95];
                  [self.toggleBtn setTitle:@"🐺" forState:UIControlStateNormal];
                  self.toggleBtn.titleLabel.font = [UIFont systemFontOfSize:22];
                  self.toggleBtn.layer.borderWidth = 1.5;
                  self.toggleBtn.layer.borderColor = [UIColor systemCyanColor].CGColor;
                  [self.toggleBtn addTarget:self action:@selector(toggleMenu) forControlEvents:UIControlEventTouchUpInside];

                  UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(handlePan:)];
                  [self.toggleBtn addGestureRecognizer:pan];
                  [self addSubview:self.toggleBtn];

                  // Khung Menu Tùy Chọn
                  self.panelView = [[UIView alloc] initWithFrame:CGRectMake(0, 55, 220, 130)];
                  self.panelView.backgroundColor = [UIColor colorWithRed:0.08 green:0.08 blue:0.12 alpha:0.95];
                  self.panelView.layer.cornerRadius = 12;
                  self.panelView.layer.borderColor = [UIColor systemPurpleColor].CGColor;
                  self.panelView.layer.borderWidth = 1.5;
                  self.panelView.hidden = YES;

                  UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(10, 8, 200, 20)];
                  title.text = @"MOD LÀNG SÓI - ADBLOCK";
                  title.textColor = [UIColor systemCyanColor];
                  title.font = [UIFont boldSystemFontOfSize:11];
                  title.textAlignment = NSTextAlignmentCenter;
                  [self.panelView addSubview:title];

                  [self addSwitch:@"Chặn QC Cuối Ván" y:38 state:g_BlockInterstitials tag:101];
                  [self addSwitch:@"Bỏ Qua QC Thưởng" y:78 state:g_AutoClaimRewards tag:102];

                  [self addSubview:self.panelView];
              }
              return self;
          }

          - (void)addSwitch:(NSString *)title y:(CGFloat)y state:(BOOL)state tag:(NSInteger)tag {
              UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(10, y, 130, 30)];
              lbl.text = title;
              lbl.textColor = [UIColor whiteColor];
              lbl.font = [UIFont systemFontOfSize:11 weight:UIFontWeightMedium];
              [self.panelView addSubview:lbl];

              UISwitch *sw = [[UISwitch alloc] initWithFrame:CGRectMake(145, y, 0, 0)];
              sw.on = state;
              sw.transform = CGAffineTransformMakeScale(0.7, 0.7);
              sw.tag = tag;
              [sw addTarget:self action:@selector(switchChanged:) forControlEvents:UIControlEventValueChanged];
              [self.panelView addSubview:sw];
          }

          - (void)switchChanged:(UISwitch *)sw {
              if (sw.tag == 101) g_BlockInterstitials = sw.isOn;
              if (sw.tag == 102) g_AutoClaimRewards = sw.isOn;
          }

          - (void)toggleMenu {
              self.isExpanded = !self.isExpanded;
              self.panelView.hidden = !self.isExpanded;
              CGRect f = self.frame;
              f.size.width = self.isExpanded ? 220 : 50;
              f.size.height = self.isExpanded ? 190 : 50;
              self.frame = f;
          }

          - (void)handlePan:(UIPanGestureRecognizer *)pan {
              CGPoint trans = [pan translationInView:self.superview];
              self.center = CGPointMake(self.center.x + trans.x, self.center.y + trans.y);
              [pan setTranslation:CGPointZero inView:self.superview];
          }

          @end

          // ----------------------------------------------------
          // 3. CAN THIỆP CHẶN VÀ NHẬN THƯỞNG QUẢNG CÁO (HOOKS)
          // ----------------------------------------------------
          static void (*orig_presentViewController)(id, SEL, UIViewController *, BOOL, void (^)(void));

          void hk_presentViewController(UIViewController *self, SEL _cmd, UIViewController *vcToPresent, BOOL animated, void (^completion)(void)) {
              NSString *className = NSStringFromClass([vcToPresent class]);

              // Nhận diện các ViewController thuộc SDK Quảng cáo (UnityAds, AdMob, AppLovin, Vungle)
              BOOL isAdVC = [className containsString:@"Ad"] || 
                            [className containsString:@"Unity"] || 
                            [className containsString:@"GAD"] || 
                            [className containsString:@"AL"] || 
                            [className containsString:@"Vungle"];

              if (isAdVC) {
                  // Chặn bật màn hình xem video quảng cáo
                  if (g_BlockInterstitials || g_AutoClaimRewards) {
                      // Kích hoạt ngay completion callback để game tưởng rằng quảng cáo đã xem xong
                      if (completion) completion();
                      return;
                  }
              }
              orig_presentViewController(self, _cmd, vcToPresent, animated, completion);
          }

          static void (*orig_makeKeyAndVisible)(id, SEL);
          static void hk_makeKeyAndVisible(UIWindow *self, SEL _cmd) {
              orig_makeKeyAndVisible(self, _cmd);
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(3.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      ModMenuView *menu = [[ModMenuView alloc] init];
                      [self addSubview:menu];
                  });
              });
          }

          __attribute__((constructor))
          static void init_mod() {
              // Hook tiến trình bật giao diện xem quảng cáo
              Method m1 = class_getInstanceMethod([UIViewController class], @selector(presentViewController:animated:completion:));
              orig_presentViewController = (void *)method_getImplementation(m1);
              method_setImplementation(m1, (IMP)hk_presentViewController);

              // Inject Mod Menu vào cửa sổ chính của game
              Method m2 = class_getInstanceMethod([UIWindow class], @selector(makeKeyAndVisible));
              orig_makeKeyAndVisible = (void *)method_getImplementation(m2);
              method_setImplementation(m2, (IMP)hk_makeKeyAndVisible);
          }
          EOF

          # Biên dịch mã nguồn Objective-C thành thư viện động (.dylib) cho chip ARM64 iOS
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -fobjc-arc -framework UIKit -framework Foundation ModLangSoi.m -o ModLangSoi.dylib

      - name: Inject Dylib into IPA using Azule
        run: |
          # Kiểm tra file LangSoi.ipa gốc trong Repository
          if [ ! -f "LangSoi.ipa" ]; then
            echo "Lỗi: Không tìm thấy tệp LangSoi.ipa gốc trong Repository!"
            echo "Vui lòng tải tệp LangSoi.ipa lên thư mục gốc của repo trước khi chạy Workflow."
            exit 1
          fi

          # Dùng Azule để tiêm ModLangSoi.dylib vào IPA
          azule -i LangSoi.ipa -o LangSoi_Modded.ipa -f ModLangSoi.dylib

      - name: Upload Modded IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangSoi-Modded-IPA
          path: LangSoi_Modded.ipa
