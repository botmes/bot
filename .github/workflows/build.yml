name: Build Flappy Cube Game IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Game and Package IPA
        run: |
          mkdir -p Payload/FlappyCube.app

          # 1. Tạo Info.plist cho Game
          python3 -c "
          import plistlib
          plist = {
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleExecutable': 'FlappyCube',
              'CFBundleIdentifier': 'com.studio.flappycube',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': 'Flappy Cube',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': '1.0',
              'CFBundleVersion': '1',
              'LSRequiresIPhoneOS': True,
              'UIRequiresFullScreen': True,
              'UIStatusBarHidden': True,
              'UILaunchScreen': {},
              'UISupportedInterfaceOrientations': [
                  'UIInterfaceOrientationPortrait'
              ],
              'UIRequiredDeviceCapabilities': ['arm64'],
              'CADisableMinimumFrameDurationOnPhone': True
          }
          with open('Payload/FlappyCube.app/Info.plist', 'wb') as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_BINARY)
          "

          printf "APPL????" > Payload/FlappyCube.app/PkgInfo

          # 2. Mã nguồn Objective-C hoàn chỉnh của Game (Flappy Cube)
          cat << 'ENDOFCODE' > main.m
          #import <UIKit/UIKit.h>

          @interface GameViewController : UIViewController
          @property (strong, nonatomic) UIView *player;
          @property (strong, nonatomic) NSMutableArray<UIView *> *obstacles;
          @property (strong, nonatomic) CADisplayLink *gameTimer;
          @property (strong, nonatomic) UILabel *scoreLabel;
          @property (strong, nonatomic) UILabel *startLabel;
          
          @property (assign, nonatomic) CGFloat playerVelocity;
          @property (assign, nonatomic) NSInteger score;
          @property (assign, nonatomic) BOOL isGameRunning;
          @end

          @implementation GameViewController

          - (BOOL)prefersStatusBarHidden { return YES; }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.1 green:0.8 blue:1.0 alpha:1.0]; // Bầu trời xanh
              
              self.obstacles = [NSMutableArray array];
              
              // Tạo nhân vật (Cube)
              self.player = [[UIView alloc] initWithFrame:CGRectMake(80, self.view.bounds.size.height / 2, 40, 40)];
              self.player.backgroundColor = [UIColor colorWithRed:1.0 green:0.8 blue:0.0 alpha:1.0]; // Khối vàng
              self.player.layer.cornerRadius = 8;
              self.player.layer.borderWidth = 2;
              self.player.layer.borderColor = [UIColor whiteColor].CGColor;
              [self.view addSubview:self.player];
              
              // Tạo điểm số
              self.scoreLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, 50, self.view.bounds.size.width, 50)];
              self.scoreLabel.text = @"0";
              self.scoreLabel.textColor = [UIColor whiteColor];
              self.scoreLabel.font = [UIFont boldSystemFontOfSize:50];
              self.scoreLabel.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:self.scoreLabel];
              
              // Chữ Hướng dẫn bắt đầu
              self.startLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, self.view.bounds.size.height / 2 + 50, self.view.bounds.size.width, 40)];
              self.startLabel.text = @"Chạm vào màn hình để BAY";
              self.startLabel.textColor = [UIColor whiteColor];
              self.startLabel.font = [UIFont boldSystemFontOfSize:22];
              self.startLabel.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:self.startLabel];
              
              self.isGameRunning = NO;
          }

          - (void)startGame {
              self.isGameRunning = YES;
              self.startLabel.hidden = YES;
              self.score = 0;
              self.scoreLabel.text = @"0";
              self.playerVelocity = 0;
              self.player.center = CGPointMake(100, self.view.bounds.size.height / 2);
              
              for (UIView *obs in self.obstacles) {
                  [obs removeFromSuperview];
              }
              [self.obstacles removeAllObjects];
              
              // Vòng lặp game 60fps
              self.gameTimer = [CADisplayLink displayLinkWithTarget:self selector:@selector(gameLoop)];
              [self.gameTimer addToRunLoop:[NSRunLoop mainRunLoop] forMode:NSDefaultRunLoopMode];
          }

          - (void)gameOver {
              self.isGameRunning = NO;
              [self.gameTimer invalidate];
              self.gameTimer = nil;
              
              self.startLabel.text = @"GAME OVER! Chạm để chơi lại";
              self.startLabel.hidden = NO;
              
              // Hiệu ứng rung màn hình nhẹ
              CABasicAnimation *shake = [CABasicAnimation animationWithKeyPath:@"position"];
              shake.duration = 0.05;
              shake.repeatCount = 3;
              shake.autoreverses = YES;
              shake.fromValue = [NSValue valueWithCGPoint:CGPointMake(self.player.center.x - 10, self.player.center.y)];
              shake.toValue = [NSValue valueWithCGPoint:CGPointMake(self.player.center.x + 10, self.player.center.y)];
              [self.player.layer addAnimation:shake forKey:@"position"];
          }

          - (void)gameLoop {
              // 1. Áp dụng trọng lực cho người chơi
              self.playerVelocity += 0.4; // Lực hút trái đất
              self.player.center = CGPointMake(self.player.center.x, self.player.center.y + self.playerVelocity);
              
              // Cập nhật góc xoay khi rớt xuống
              CGFloat rotation = MIN(MAX(self.playerVelocity * 0.1, -M_PI_4), M_PI_2);
              self.player.transform = CGAffineTransformMakeRotation(rotation);
              
              // 2. Chạm đất hoặc trần nhà -> Thua
              if (self.player.frame.origin.y > self.view.bounds.size.height || self.player.frame.origin.y < 0) {
                  [self.gameOver];
                  return;
              }
              
              // 3. Sinh ra ống nước chướng ngại vật
              if (self.obstacles.count == 0 || [[self.obstacles lastObject] frame].origin.x < self.view.bounds.size.width - 200) {
                  CGFloat gapSize = 180; // Khoảng trống chui qua
                  CGFloat randomY = arc4random_uniform(self.view.bounds.size.height - 300) + 100;
                  
                  // Ống trên
                  UIView *topObs = [[UIView alloc] initWithFrame:CGRectMake(self.view.bounds.size.width, 0, 60, randomY - gapSize/2)];
                  topObs.backgroundColor = [UIColor colorWithRed:0.2 green:0.8 blue:0.2 alpha:1.0];
                  topObs.layer.cornerRadius = 5;
                  [self.view addSubview:topObs];
                  [self.obstacles addObject:topObs];
                  
                  // Ống dưới
                  UIView *bottomObs = [[UIView alloc] initWithFrame:CGRectMake(self.view.bounds.size.width, randomY + gapSize/2, 60, self.view.bounds.size.height)];
                  bottomObs.backgroundColor = [UIColor colorWithRed:0.2 green:0.8 blue:0.2 alpha:1.0];
                  bottomObs.layer.cornerRadius = 5;
                  [self.view addSubview:bottomObs];
                  [self.obstacles addObject:bottomObs];
              }
              
              // 4. Di chuyển ống nước và kiểm tra va chạm
              NSMutableArray *toRemove = [NSMutableArray array];
              for (int i = 0; i < self.obstacles.count; i++) {
                  UIView *obs = self.obstacles[i];
                  obs.center = CGPointMake(obs.center.x - 3.5, obs.center.y); // Tốc độ ống
                  
                  // Kiểm tra va chạm (Thua)
                  if (CGRectIntersectsRect(self.player.frame, obs.frame)) {
                      [self.gameOver];
                      return;
                  }
                  
                  // Vượt qua ống -> Cộng điểm (chỉ tính 1 lần cho ống trên)
                  if (i % 2 == 0 && obs.center.x < self.player.center.x && !CGAffineTransformEqualToTransform(obs.transform, CGAffineTransformMakeScale(1, -1))) {
                      self.score++;
                      self.scoreLabel.text = [NSString stringWithFormat:@"%ld", (long)self.score];
                      obs.transform = CGAffineTransformMakeScale(1, -1); // Đánh dấu đã qua
                  }
                  
                  // Dọn dẹp ống đi khuất màn hình
                  if (obs.frame.origin.x + obs.frame.size.width < 0) {
                      [toRemove addObject:obs];
                  }
              }
              
              for (UIView *obs in toRemove) {
                  [obs removeFromSuperview];
                  [self.obstacles removeObject:obs];
              }
          }

          // Nhận sự kiện chạm tay vào màn hình
          - (void)touchesBegan:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              if (!self.isGameRunning) {
                  [self startGame];
              }
              // Lực đẩy lên (Nhảy)
              self.playerVelocity = -8.5; 
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[GameViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          ENDOFCODE

          # 3. Biên dịch game
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -w \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            main.m -o Payload/FlappyCube.app/FlappyCube

          # 4. Đóng gói IPA
          zip -r FlappyCube_Game.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyCube-Game-IPA
          path: FlappyCube_Game.ipa
