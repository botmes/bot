name: Build Love Thuy Mid Autumn IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Package App IPA
        run: |
          mkdir -p Payload/SunsetRacer.app

          # 1. Tạo Info.plist chuẩn iOS (Màn hình ngang Landscape)
          python3 -c "
          import plistlib
          plist = {
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleExecutable': 'SunsetRacer',
              'CFBundleIdentifier': 'com.devnvios.lovethuy',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': 'Love Thùy',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': '2.0',
              'CFBundleVersion': '2',
              'LSRequiresIPhoneOS': True,
              'UIRequiresFullScreen': True,
              'UIStatusBarHidden': True,
              'UISupportedInterfaceOrientations': [
                  'UIInterfaceOrientationLandscapeRight',
                  'UIInterfaceOrientationLandscapeLeft'
              ],
              'UIRequiredDeviceCapabilities': ['arm64'],
              'CADisableMinimumFrameDurationOnPhone': True
          }
          with open('Payload/SunsetRacer.app/Info.plist', 'wb') as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_BINARY)
          "

          printf "APPL????" > Payload/SunsetRacer.app/PkgInfo

          # 2. Mã nguồn Objective-C: Cây bút thần vẽ Trái Tim, Lồng Đèn & Pháo Hoa
          cat << 'ENDOFCODE' > main.m
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          @interface MasterpieceViewController : UIViewController
          @property (nonatomic, strong) CAShapeLayer *drawingLayer;
          @property (nonatomic, strong) UIView *penTipView;
          @property (nonatomic, strong) CAEmitterLayer *fireworksEmitter;
          @property (nonatomic, assign) BOOL isLayoutDone;
          @end

          @implementation MasterpieceViewController

          - (BOOL)prefersStatusBarHidden { return YES; }
          - (BOOL)prefersHomeIndicatorAutoHidden { return YES; }
          - (UIInterfaceOrientationMask)supportedInterfaceOrientations {
              return UIInterfaceOrientationMaskLandscape;
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.02 green:0.01 blue:0.08 alpha:1.0];
          }

          - (void)viewDidLayoutSubviews {
              [super viewDidLayoutSubviews];
              if (!self.isLayoutDone && self.view.bounds.size.width > self.view.bounds.size.height) {
                  self.isLayoutDone = YES;
                  [self setupScene];
              }
          }

          - (void)setupScene {
              CGFloat w = self.view.bounds.size.width;
              CGFloat h = self.view.bounds.size.height;

              // 1. Mặt trăng Trung Thu phát sáng
              UIView *moon = [[UIView alloc] initWithFrame:CGRectMake(w - 140, 25, 80, 80)];
              moon.backgroundColor = [UIColor colorWithRed:1.0 green:0.95 blue:0.8 alpha:1.0];
              moon.layer.cornerRadius = 40;
              moon.layer.shadowColor = [UIColor colorWithRed:1.0 green:0.85 blue:0.4 alpha:1.0].CGColor;
              moon.layer.shadowRadius = 25;
              moon.layer.shadowOpacity = 0.95;
              moon.layer.shadowOffset = CGSizeZero;
              [self.view addSubview:moon];

              // 2. Tiêu đề chúc mừng
              UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, 15, w, 40)];
              titleLabel.text = @"🏮 LOVE THÙY - CHÚC TẾT TRUNG THU AN LÀNH 🥮";
              titleLabel.textColor = [UIColor colorWithRed:1.0 green:0.8 blue:0.3 alpha:1.0];
              titleLabel.font = [UIFont fontWithName:@"HelveticaNeue-Bold" size:22];
              titleLabel.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:titleLabel];

              // 3. Đường vẽ BezierPath (Trái tim bên trái & Lồng đèn bên phải)
              UIBezierPath *path = [UIBezierPath bezierPath];
              
              // --- Nét 1: Trái Tim ---
              CGFloat cx = w * 0.28;
              CGFloat cy = h * 0.55;
              [path moveToPoint:CGPointMake(cx, cy - 40)];
              [path addCurveToPoint:CGPointMake(cx - 80, cy - 100) controlPoint1:CGPointMake(cx - 40, cy - 90) controlPoint2:CGPointMake(cx - 80, cy - 90)];
              [path addCurveToPoint:CGPointMake(cx, cy + 50) controlPoint1:CGPointMake(cx - 80, cy - 30) controlPoint2:CGPointMake(cx - 20, cy + 20)];
              [path addCurveToPoint:CGPointMake(cx + 80, cy - 100) controlPoint1:CGPointMake(cx + 20, cy + 20) controlPoint2:CGPointMake(cx + 80, cy - 30)];
              [path addCurveToPoint:CGPointMake(cx, cy - 40) controlPoint1:CGPointMake(cx + 80, cy - 90) controlPoint2:CGPointMake(cx + 40, cy - 90)];

              // --- Nét 2: Lồng Đèn Trung Thu ---
              CGFloat lx = w * 0.72;
              CGFloat ly = h * 0.52;
              [path moveToPoint:CGPointMake(lx, ly - 70)];
              [path addLineToPoint:CGPointMake(lx, ly - 50)];
              [path addCurveToPoint:CGPointMake(lx + 45, ly) controlPoint1:CGPointMake(lx + 40, ly - 50) controlPoint2:CGPointMake(lx + 45, ly - 25)];
              [path addCurveToPoint:CGPointMake(lx, ly + 50) controlPoint1:CGPointMake(lx + 45, ly + 25) controlPoint2:CGPointMake(lx + 40, ly + 50)];
              [path addCurveToPoint:CGPointMake(lx - 45, ly) controlPoint1:CGPointMake(lx - 40, ly + 50) controlPoint2:CGPointMake(lx - 45, ly + 25)];
              [path addCurveToPoint:CGPointMake(lx, ly - 50) controlPoint1:CGPointMake(lx - 45, ly - 25) controlPoint2:CGPointMake(lx - 40, ly - 50)];
              [path moveToPoint:CGPointMake(lx, ly + 50)];
              [path addLineToPoint:CGPointMake(lx, ly + 75)];

              // Layer nét vẽ
              self.drawingLayer = [CAShapeLayer layer];
              self.drawingLayer.path = path.CGPath;
              self.drawingLayer.strokeColor = [UIColor colorWithRed:1.0 green:0.35 blue:0.65 alpha:1.0].CGColor;
              self.drawingLayer.fillColor = [UIColor colorWithRed:1.0 green:0.4 blue:0.7 alpha:0.15].CGColor;
              self.drawingLayer.lineWidth = 4.5;
              self.drawingLayer.lineCap = kCALineCapRound;
              self.drawingLayer.lineJoin = kCALineJoinRound;
              self.drawingLayer.strokeEnd = 0.0;
              [self.view.layer addSublayer:self.drawingLayer];

              // Animation vẽ liên tục
              CABasicAnimation *drawAnim = [CABasicAnimation animationWithKeyPath:@"strokeEnd"];
              drawAnim.duration = 5.0;
              drawAnim.fromValue = @(0.0);
              drawAnim.toValue = @(1.0);
              drawAnim.timingFunction = [CAMediaTimingFunction functionWithName:kCAMediaTimingFunctionEaseInEaseOut];
              drawAnim.repeatCount = HUGE_VALF;
              [self.drawingLayer addAnimation:drawAnim forKey:@"drawAction"];

              // 4. Bút thần phát sáng chạy theo đường vẽ
              self.penTipView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 24, 24)];
              self.penTipView.backgroundColor = [UIColor colorWithRed:1.0 green:0.9 blue:0.3 alpha:1.0];
              self.penTipView.layer.cornerRadius = 12;
              self.penTipView.layer.borderColor = [UIColor whiteColor].CGColor;
              self.penTipView.layer.borderWidth = 2.0;
              self.penTipView.layer.shadowColor = [UIColor colorWithRed:1.0 green:0.8 blue:0.2 alpha:1.0].CGColor;
              self.penTipView.layer.shadowRadius = 10;
              self.penTipView.layer.shadowOpacity = 1.0;
              self.penTipView.layer.shadowOffset = CGSizeZero;
              [self.view addSubview:self.penTipView];

              CAKeyframeAnimation *penAnim = [CAKeyframeAnimation animationWithKeyPath:@"position"];
              penAnim.path = path.CGPath;
              penAnim.duration = 5.0;
              penAnim.calculationMode = kCAAnimationCalculationPaced;
              penAnim.repeatCount = HUGE_VALF;
              [self.penTipView.layer addAnimation:penAnim forKey:@"penMotion"];

              // 5. Chữ "Love Thùy" phát sáng nổi bật ở giữa
              UILabel *loveLabel = [[UILabel alloc] initWithFrame:CGRectMake(w * 0.38, h * 0.48, w * 0.24, 50)];
              loveLabel.text = @"Love Thùy";
              loveLabel.textColor = [UIColor colorWithRed:1.0 green:0.4 blue:0.7 alpha:1.0];
              loveLabel.font = [UIFont fontWithName:@"SnellRoundhand-Bold" size:32] ?: [UIFont boldSystemFontOfSize:30];
              loveLabel.textAlignment = NSTextAlignmentCenter;
              loveLabel.layer.shadowColor = [UIColor colorWithRed:1.0 green:0.3 blue:0.6 alpha:1.0].CGColor;
              loveLabel.layer.shadowRadius = 10;
              loveLabel.layer.shadowOpacity = 0.9;
              loveLabel.layer.shadowOffset = CGSizeZero;
              [self.view addSubview:loveLabel];

              // 6. Bắn pháo hoa
              [self setupFireworksShowWithWidth:w height:h];
          }

          - (void)setupFireworksShowWithWidth:(CGFloat)w height:(CGFloat)h {
              self.fireworksEmitter = [CAEmitterLayer layer];
              self.fireworksEmitter.emitterPosition = CGPointMake(w / 2, h + 10);
              self.fireworksEmitter.emitterSize = CGSizeMake(w, 10);

              CAEmitterCell *rocket = [CAEmitterCell emitterCell];
              rocket.birthRate = 2.5;
              rocket.lifetime = 1.6;
              rocket.velocity = 380;
              rocket.velocityRange = 100;
              rocket.yAcceleration = 140;
              rocket.emissionRange = M_PI / 4;
              rocket.scale = 0.12;

              CAEmitterCell *sparkle = [CAEmitterCell emitterCell];
              sparkle.birthRate = 1200;
              sparkle.lifetime = 2.2;
              sparkle.velocity = 160;
              sparkle.scale = 0.08;
              sparkle.scaleSpeed = -0.02;
              sparkle.alphaSpeed = -0.35;
              sparkle.spin = 3.0;

              UIGraphicsBeginImageContext(CGSizeMake(12, 12));
              CGContextRef ctx = UIGraphicsGetCurrentContext();
              CGContextSetFillColorWithColor(ctx, [UIColor whiteColor].CGColor);
              CGContextFillEllipseInRect(ctx, CGRectMake(0, 0, 12, 12));
              UIImage *sparkImg = UIGraphicsGetImageFromCurrentImageContext();
              UIGraphicsEndImageContext();

              sparkle.contents = (__bridge id)[sparkImg CGImage];
              rocket.emitterCells = @[sparkle];

              self.fireworksEmitter.emitterCells = @[rocket];
              [self.view.layer addSublayer:self.fireworksEmitter];
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[MasterpieceViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          ENDOFCODE

          # 3. Biên dịch trực tiếp ra file nhị phân iOS
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -w \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            main.m -o Payload/SunsetRacer.app/SunsetRacer

          # 4. Đóng gói IPA
          zip -r SunsetRacer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveThuy-Masterpiece-IPA
          path: SunsetRacer.ipa
