name: Build Facebook Messenger Auto Reply IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          mkdir -p Payload/FBAutoTool.app
          
          # 1. Tạo file Info.plist đăng ký quyền Chạy Ngầm Âm Thanh (Background Audio)
          cat << 'EOF' > Payload/FBAutoTool.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.devnvios.fbautoreply</string>
              <key>CFBundleName</key>
              <string>FBAutoTool</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>FBAutoTool</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

          # 2. Tạo mã nguồn Objective-C có lưu Persistent Cookie & Selector quét tin nhắn linh hoạt
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <AVFoundation/AVFoundation.h>

          @interface MainViewController : UIViewController <WKNavigationDelegate, UITextFieldDelegate>
          @property (nonatomic, strong) WKWebView *webView;
          @property (nonatomic, strong) UIView *floatingMenu;
          @property (nonatomic, strong) UIView *contentContainer;
          @property (nonatomic, strong) UITextField *replyInput;
          @property (nonatomic, strong) UIButton *toggleBotBtn;
          @property (nonatomic, strong) UIButton *minBtn;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, assign) CGPoint initialCenter;
          @property (nonatomic, assign) BOOL isMinimized;
          @property (nonatomic, assign) BOOL isBotActive;
          @end

          @implementation MainViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor blackColor];
              self.isBotActive = NO;

              // Bật Audio Session duy trì chạy ngầm ứng dụng khi khóa màn hình
              NSError *error = nil;
              [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryPlayback error:&error];
              [[AVAudioSession sharedInstance] setActive:YES error:&error];

              // Cấu hình Persistent Data Store để LƯU COOKIE & ĐĂNG NHẬP VĨNH VIỄN
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              config.websiteDataStore = [WKWebsiteDataStore defaultDataStore];
              config.allowsInlineMediaPlayback = YES;
              config.mediaTypesRequiringUserActionForPlayback = WKAudiovisualMediaTypeNone;

              self.webView = [[WKWebView alloc] initWithFrame:self.view.bounds configuration:config];
              self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.webView.navigationDelegate = self;
              
              // Mobile User-Agent tối ưu cho giao diện Messenger/Facebook
              self.webView.customUserAgent = @"Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4 Mobile/15E148 Safari/605.1.15";
              
              [self.view addSubview:self.webView];

              NSURL *url = [NSURL URLWithString:@"https://www.facebook.com/messages/t/"];
              [self.webView loadRequest:[NSURLRequest requestWithURL:url]];

              [self setupFloatingMenu];
          }

          - (BOOL)prefersStatusBarHidden {
              return YES;
          }

          - (void)setupFloatingMenu {
              CGFloat menuW = 300;
              CGFloat menuH = 220;
              self.isMinimized = NO;
              
              self.floatingMenu = [[UIView alloc] initWithFrame:CGRectMake(20, 60, menuW, menuH)];
              self.floatingMenu.backgroundColor = [[UIColor colorWithRed:0.1 green:0.1 blue:0.14 alpha:0.95] colorWithAlphaComponent:0.95];
              self.floatingMenu.layer.cornerRadius = 14;
              self.floatingMenu.layer.borderWidth = 1.5;
              self.floatingMenu.layer.borderColor = [UIColor colorWithRed:0.0 green:0.5 blue:1.0 alpha:0.8].CGColor;
              self.floatingMenu.clipsToBounds = YES;

              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(handlePan:)];
              [self.floatingMenu addGestureRecognizer:pan];

              UIView *headerView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, menuW, 36)];
              headerView.backgroundColor = [UIColor colorWithRed:0.18 green:0.18 blue:0.22 alpha:1.0];
              [self.floatingMenu addSubview:headerView];

              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(10, 0, menuW - 50, 36)];
              title.text = @"🤖 MESSENGER AUTO REPLY";
              title.textColor = [UIColor whiteColor];
              title.font = [UIFont boldSystemFontOfSize:12];
              [headerView addSubview:title];

              self.minBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.minBtn.frame = CGRectMake(menuW - 36, 0, 36, 36);
              [self.minBtn setTitle:@"➖" forState:UIControlStateNormal];
              [self.minBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              [self.minBtn addTarget:self action:@selector(toggleMinimize) forControlEvents:UIControlEventTouchUpInside];
              [headerView addSubview:self.minBtn];

              self.contentContainer = [[UIView alloc] initWithFrame:CGRectMake(0, 36, menuW, menuH - 36)];
              [self.floatingMenu addSubview:self.contentContainer];

              UILabel *inputLabel = [[UILabel alloc] initWithFrame:CGRectMake(10, 8, menuW - 20, 18)];
              inputLabel.text = @"Vui lòng nhập nội dung tự động:";
              inputLabel.textColor = [UIColor lightGrayColor];
              inputLabel.font = [UIFont systemFontOfSize:11 weight:UIFontWeightMedium];
              [self.contentContainer addSubview:inputLabel];

              self.replyInput = [[UITextField alloc] initWithFrame:CGRectMake(10, 28, menuW - 20, 36)];
              self.replyInput.placeholder = @"VD: bot devnvios đang bận tí rep nhé";
              self.replyInput.text = @"bot devnvios đang bận tí rep nhé";
              self.replyInput.backgroundColor = [UIColor colorWithRed:0.2 green:0.2 blue:0.25 alpha:1.0];
              self.replyInput.textColor = [UIColor whiteColor];
              self.replyInput.font = [UIFont systemFontOfSize:12];
              self.replyInput.layer.cornerRadius = 6;
              self.replyInput.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 8, 36)];
              self.replyInput.leftViewMode = UITextFieldViewModeAlways;
              self.replyInput.delegate = self;
              [self.contentContainer addSubview:self.replyInput];

              self.toggleBotBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.toggleBotBtn.frame = CGRectMake(10, 72, menuW - 20, 38);
              [self.toggleBotBtn setTitle:@"▶️ Bật Bot Auto Reply" forState:UIControlStateNormal];
              [self.toggleBotBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.toggleBotBtn.backgroundColor = [UIColor colorWithRed:0.0 green:0.6 blue:0.2 alpha:1.0];
              self.toggleBotBtn.titleLabel.font = [UIFont boldSystemFontOfSize:13];
              self.toggleBotBtn.layer.cornerRadius = 8;
              [self.toggleBotBtn addTarget:self action:@selector(toggleBotState) forControlEvents:UIControlEventTouchUpInside];
              [self.contentContainer addSubview:self.toggleBotBtn];

              self.statusLabel = [[UILabel alloc] initWithFrame:CGRectMake(10, 118, menuW - 20, 50)];
              self.statusLabel.text = @"Trạng thái: Đang TẮT\nVui lòng đăng nhập Messenger trước khi BẬT.";
              self.statusLabel.textColor = [UIColor systemOrangeColor];
              self.statusLabel.font = [UIFont systemFontOfSize:11];
              self.statusLabel.numberOfLines = 2;
              self.statusLabel.textAlignment = NSTextAlignmentCenter;
              [self.contentContainer addSubview:self.statusLabel];

              [self.view addSubview:self.floatingMenu];
          }

          - (BOOL)textFieldShouldReturn:(UITextField *)textField {
              [textField resignFirstResponder];
              return YES;
          }

          - (void)toggleMinimize {
              self.isMinimized = !self.isMinimized;
              [UIView animateWithDuration:0.25 animations:^{
                  if (self.isMinimized) {
                      self.floatingMenu.frame = CGRectMake(self.floatingMenu.frame.origin.x, self.floatingMenu.frame.origin.y, 60, 36);
                      self.contentContainer.hidden = YES;
                      [self.minBtn setTitle:@"🤖" forState:UIControlStateNormal];
                  } else {
                      self.floatingMenu.frame = CGRectMake(self.floatingMenu.frame.origin.x, self.floatingMenu.frame.origin.y, 300, 220);
                      self.contentContainer.hidden = NO;
                      [self.minBtn setTitle:@"➖" forState:UIControlStateNormal];
                  }
              }];
          }

          - (void)handlePan:(UIPanGestureRecognizer *)pan {
              CGPoint translation = [pan translationInView:self.view];
              if (pan.state == UIGestureRecognizerStateBegan) {
                  self.initialCenter = self.floatingMenu.center;
              }
              if (pan.state == UIGestureRecognizerStateBegan || pan.state == UIGestureRecognizerStateChanged) {
                  self.floatingMenu.center = CGPointMake(self.initialCenter.x + translation.x, self.initialCenter.y + translation.y);
              }
          }

          - (void)toggleBotState {
              self.isBotActive = !self.isBotActive;
              if (self.isBotActive) {
                  [self.toggleBotBtn setTitle:@"⏸️ Tắt Bot Auto Reply" forState:UIControlStateNormal];
                  self.toggleBotBtn.backgroundColor = [UIColor colorWithRed:0.8 green:0.1 blue:0.2 alpha:1.0];
                  self.statusLabel.text = @"🟢 Bot đang CHẠY NGẦM...\nTự động trả lời & không gửi trùng người cũ.";
                  self.statusLabel.textColor = [UIColor systemGreenColor];
                  [self injectAndStartBot];
              } else {
                  [self.toggleBotBtn setTitle:@"▶️ Bật Bot Auto Reply" forState:UIControlStateNormal];
                  self.toggleBotBtn.backgroundColor = [UIColor colorWithRed:0.0 green:0.6 blue:0.2 alpha:1.0];
                  self.statusLabel.text = @"🔴 Bot đã TẮT.";
                  self.statusLabel.textColor = [UIColor systemOrangeColor];
                  
                  NSString *stopJS = @"window.isBotRunning = false;";
                  [self.webView evaluateJavaScript:stopJS completionHandler:nil];
              }
          }

          - (void)injectAndStartBot {
              NSString *msgText = [self.replyInput.text stringByReplacingOccurrencesOfString:@"'" withString:@"\\'"];
              
              // Script JS quét đa tầng hỗ trợ cả giao diện Facebook Chat Widget lẫn Messenger Web
              NSString *jsScript = [NSString stringWithFormat:@"\
              (function() {\
                  window.autoReplyText = '%@';\
                  window.isBotRunning = true;\
                  window.repliedUsers = window.repliedUsers || new Set();\
                  \
                  if (!document.getElementById('silent-audio-keepalive')) {\
                      var audio = document.createElement('audio');\
                      audio.id = 'silent-audio-keepalive';\
                      audio.loop = true;\
                      audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';\
                      document.body.appendChild(audio);\
                      audio.play().catch(function(e){});\
                  }\
                  \
                  if (window.botInterval) clearInterval(window.botInterval);\
                  \
                  window.botInterval = setInterval(function() {\
                      if (!window.isBotRunning) return;\
                      \
                      // 1. Quét danh sách hội thoại chưa đọc trên Messenger / FB Chat
                      var unreadItems = document.querySelectorAll('[role=\"row\"][aria-label*=\"Unread\"], [role=\"row\"][aria-label*=\"Chưa đọc\"], div[aria-label*=\"chưa đọc\"]');\
                      if (unreadItems.length > 0) {\
                          var chat = unreadItems[0];\
                          var userTitle = chat.innerText ? chat.innerText.split('\\n')[0] : 'Unknown';\
                          \
                          if (!window.repliedUsers.has(userTitle)) {\
                              chat.click();\
                              setTimeout(function() {\
                                  var input = document.querySelector('div[role=\"textbox\"], textarea[name=\"message_body\"], p[class*=\"p_k32\"]');\
                                  if (input) {\
                                      input.focus();\
                                      document.execCommand('insertText', false, window.autoReplyText);\
                                      setTimeout(function() {\
                                          var sendBtn = document.querySelector('div[aria-label=\"Press Enter to send\"], div[aria-label=\"Gửi\"], div[aria-label=\"Send\"], [type=\"submit\"]');\
                                          if (sendBtn) {\
                                              sendBtn.click();\
                                          } else {\
                                              var enterEvent = new KeyboardEvent('keydown', {key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true});\
                                              input.dispatchEvent(enterEvent);\
                                          }\
                                          window.repliedUsers.add(userTitle);\
                                      }, 1000);\
                                  }\
                              }, 1500);\
                          }\
                      } else {\
                          // 2. Tự động kiểm tra ô chat đang mở trên Facebook Web
                          var activeInput = document.querySelector('div[role=\"textbox\"]');\
                          if (activeInput && activeInput.innerText.trim() === '') {\
                              var titleHeader = document.querySelector('h2, [role=\"main\"] h1');\
                              var currentChatName = titleHeader ? titleHeader.innerText : 'ActiveChat';\
                              if (!window.repliedUsers.has(currentChatName)) {\
                                  activeInput.focus();\
                                  document.execCommand('insertText', false, window.autoReplyText);\
                                  setTimeout(function() {\
                                      var sendBtn = document.querySelector('div[aria-label=\"Press Enter to send\"], div[aria-label=\"Gửi\"], div[aria-label=\"Send\"]');\
                                      if (sendBtn) sendBtn.click();\
                                      window.repliedUsers.add(currentChatName);\
                                  }, 1000);\
                              }\
                          }\
                      }\
                  }, 4000);\
              })();", msgText];

              [self.webView evaluateJavaScript:jsScript completionHandler:nil];
          }

          - (void)webView:(WKWebView *)webView didFinishNavigation:(WKNavigation *)navigation {
              if (self.isBotActive) {
                  [self injectAndStartBot];
              }
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          #pragma clang diagnostic push
          #pragma clang diagnostic ignored "-Wdeprecated-declarations"
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[MainViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end
          #pragma clang diagnostic pop

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # 3. Biên dịch bằng Clang
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc \
            -Wno-deprecated-declarations -Wno-error \
            -framework UIKit -framework Foundation -framework WebKit -framework CoreGraphics -framework AVFoundation \
            main.m -o Payload/FBAutoTool.app/FBAutoTool

          # 4. Đóng gói file IPA
          zip -r FBAutoTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBAutoTool-IPA
          path: FBAutoTool.ipa
