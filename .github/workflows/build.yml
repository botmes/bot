name: Build Love Thuy Mid Autumn IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Package App IPA
        run: |
          mkdir -p Payload/SunsetRacer.app

          # 1. Tạo Info.plist chuẩn iOS bằng Python (Chống lỗi EOF)
          python3 -c "
          import plistlib
          plist = {
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleExecutable': 'SunsetRacer',
              'CFBundleIdentifier': 'com.devnvios.lovethuy',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': 'Love Thùy',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': '1.0',
              'CFBundleVersion': '1',
              'LSRequiresIPhoneOS': True,
              'UIRequiresFullScreen': True,
              'UIStatusBarHidden': True,
              'UISupportedInterfaceOrientations': [
                  'UIInterfaceOrientationLandscapeRight',
                  'UIInterfaceOrientationLandscapeLeft'
              ],
              'UIRequiredDeviceCapabilities': ['arm64'],
              'CADisableMinimumFrameDurationOnPhone': True
          }
          with open('Payload/SunsetRacer.app/Info.plist', 'wb') as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_BINARY)
          "

          printf "APPL????" > Payload/SunsetRacer.app/PkgInfo

          # 2. Tạo Mã Nguồn Đêm Trung Thu - Love Thùy & Pháo Hoa
          cat << 'ENDOFCODE' > main.m
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          @interface ThuyLoveViewController : UIViewController
          @property (nonatomic, strong) UILabel *titleLabel;
          @property (nonatomic, strong) CAShapeLayer *heartPathLayer;
          @property (nonatomic, strong) CAEmitterLayer *fireworksEmitter;
          @property (nonatomic, strong) CAEmitterLayer *starsEmitter;
          @end

          @implementation ThuyLoveViewController

          - (BOOL)prefersStatusBarHidden { return YES; }
          - (BOOL)prefersHomeIndicatorAutoHidden { return YES; }
          - (UIInterfaceOrientationMask)supportedInterfaceOrientations {
              return UIInterfaceOrientationMaskLandscape;
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.02 blue:0.12 alpha:1.0];

              [self setupMoonAndLanterns];
              [self setupStarsBackground];
              [self setupLoveThuyHeader];
              [self setupAnimatedHeart];
              [self setupFireworks];
          }

          - (void)setupMoonAndLanterns {
              // 1. Mặt trăng Trung Thu phát sáng
              UIView *moon = [[UIView alloc] initWithFrame:CGRectMake(self.view.bounds.size.width - 160, 30, 110, 110)];
              moon.backgroundColor = [UIColor colorWithRed:1.0 green:0.95 blue:0.75 alpha:1.0];
              moon.layer.cornerRadius = 55;
              moon.layer.shadowColor = [UIColor colorWithRed:1.0 green:0.9 blue:0.5 alpha:1.0].CGColor;
              moon.layer.shadowRadius = 25;
              moon.layer.shadowOpacity = 0.9;
              moon.layer.shadowOffset = CGSizeZero;
              moon.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
              [self.view addSubview:moon];

              // 2. Dòng chữ chúc mừng Tết Trung Thu
              UILabel *midAutumnLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, self.view.bounds.size.height - 70, self.view.bounds.size.width, 40)];
              midAutumnLabel.text = @"🥮 Chúc Thùy Tết Trung Thu Vui Vẻ & Hạnh Phúc! 🏮";
              midAutumnLabel.textColor = [UIColor colorWithRed:1.0 green:0.85 blue:0.4 alpha:1.0];
              midAutumnLabel.font = [UIFont fontWithName:@"HelveticaNeue-Bold" size:22];
              midAutumnLabel.textAlignment = NSTextAlignmentCenter;
              midAutumnLabel.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleTopMargin;
              [self.view addSubview:midAutumnLabel];
          }

          - (void)setupStarsBackground {
              self.starsEmitter = [CAEmitterLayer layer];
              self.starsEmitter.emitterPosition = CGPointMake(self.view.bounds.size.width / 2, self.view.bounds.size.height / 2);
              self.starsEmitter.emitterSize = self.view.bounds.size;
              self.starsEmitter.emitterShape = kCAEmitterLayerRectangle;

              CAEmitterCell *star = [CAEmitterCell emitterCell];
              star.birthRate = 8;
              star.lifetime = 6.0;
              star.velocity = 10;
              star.scale = 0.05;
              star.scaleRange = 0.03;
              star.alphaSpeed = -0.15;
              star.color = [UIColor colorWithRed:1.0 green:1.0 blue:0.8 alpha:0.8].CGColor;

              UIGraphicsBeginImageContext(CGSizeMake(12, 12));
              CGContextRef ctx = UIGraphicsGetCurrentContext();
              CGContextSetFillColorWithColor(ctx, [UIColor whiteColor].CGColor);
              CGContextFillEllipseInRect(ctx, CGRectMake(0, 0, 12, 12));
              UIImage *starImg = UIGraphicsGetImageFromCurrentImageContext();
              UIGraphicsEndImageContext();

              star.contents = (__bridge id)[starImg CGImage];
              self.starsEmitter.emitterCells = @[star];
              [self.view.layer addSublayer:self.starsEmitter];
          }

          - (void)setupLoveThuyHeader {
              // Chữ "Love Thùy"
              self.titleLabel = [[UILabel alloc] init];
              self.titleLabel.text = @"Love Thùy";
              self.titleLabel.font = [UIFont fontWithName:@"MarkerFelt-Wide" size:42];
              if (!self.titleLabel.font) {
                  self.titleLabel.font = [UIFont boldSystemFontOfSize:42];
              }
              self.titleLabel.textColor = [UIColor colorWithRed:1.0 green:0.4 blue:0.7 alpha:1.0];
              [self.titleLabel sizeToFit];
              
              float totalWidth = self.titleLabel.frame.size.width + 60;
              float startX = (self.view.bounds.size.width - totalWidth) / 2;
              
              self.titleLabel.frame = CGRectMake(startX, 80, self.titleLabel.frame.size.width, 60);
              self.titleLabel.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin | UIViewAutoresizingFlexibleRightMargin;
              [self.view addSubview:self.titleLabel];
          }

          - (void)setupAnimatedHeart {
              // Vẽ trái tim bằng nét bút màu hồng ngay ngang chữ Thùy
              UIBezierPath *heartPath = [UIBezierPath bezierPath];
              float heartX = self.titleLabel.frame.origin.x + self.titleLabel.frame.size.width + 25;
              float heartY = self.titleLabel.frame.origin.y + 25;
              float scale = 0.9;

              [heartPath moveToPoint:CGPointMake(heartX, heartY)];
              [heartPath addCurveToPoint:CGPointMake(heartX - (20 * scale), heartY - (20 * scale))
                           controlPoint1:CGPointMake(heartX - (10 * scale), heartY - (15 * scale))
                           controlPoint2:CGPointMake(heartX - (20 * scale), heartY - (10 * scale))];
              [heartPath addCurveToPoint:CGPointMake(heartX, heartY + (20 * scale))
                           controlPoint1:CGPointMake(heartX - (20 * scale), heartY + (10 * scale))
                           controlPoint2:CGPointMake(heartX - (10 * scale), heartY + (18 * scale))];
              [heartPath addCurveToPoint:CGPointMake(heartX + (20 * scale), heartY - (20 * scale))
                           controlPoint1:CGPointMake(heartX + (10 * scale), heartY + (18 * scale))
                           controlPoint2:CGPointMake(heartX + (20 * scale), heartY + (10 * scale))];
              [heartPath addCurveToPoint:CGPointMake(heartX, heartY)
                           controlPoint1:CGPointMake(heartX + (20 * scale), heartY - (10 * scale))
                           controlPoint2:CGPointMake(heartX + (10 * scale), heartY - (15 * scale))];

              self.heartPathLayer = [CAShapeLayer layer];
              self.heartPathLayer.path = heartPath.CGPath;
              self.heartPathLayer.strokeColor = [UIColor colorWithRed:1.0 green:0.2 blue:0.6 alpha:1.0].CGColor;
              self.heartPathLayer.fillColor = [UIColor colorWithRed:1.0 green:0.4 blue:0.7 alpha:0.3].CGColor;
              self.heartPathLayer.lineWidth = 4.0;
              self.heartPathLayer.lineCap = kCALineCapRound;
              self.heartPathLayer.strokeEnd = 0.0;

              [self.view.layer addSublayer:self.heartPathLayer];

              // Hiệu ứng tự vẽ nét bút trái tim
              CABasicAnimation *drawAnimation = [CABasicAnimation animationWithKeyPath:@"strokeEnd"];
              drawAnimation.duration = 2.0;
              drawAnimation.fromValue = @(0.0);
              drawAnimation.toValue = @(1.0);
              drawAnimation.timingFunction = [CAMediaTimingFunction functionWithName:kCAMediaTimingFunctionEaseInEaseOut];
              drawAnimation.repeatCount = HUGE_VALF;
              [self.heartPathLayer addAnimation:drawAnimation forKey:@"drawHeart"];
          }

          - (void)setupFireworks {
              // Bắn pháo hoa rực rỡ lấp lánh
              self.fireworksEmitter = [CAEmitterLayer layer];
              self.fireworksEmitter.emitterPosition = CGPointMake(self.view.bounds.size.width / 2, self.view.bounds.size.height);
              self.fireworksEmitter.emitterSize = CGSizeMake(self.view.bounds.size.width * 0.8, 1.0);

              CAEmitterCell *rocket = [CAEmitterCell emitterCell];
              rocket.birthRate = 1.2;
              rocket.lifetime = 1.8;
              rocket.velocity = 380;
              rocket.velocityRange = 80;
              rocket.yAcceleration = 120;
              rocket.emissionWindow = M_PI / 6;
              rocket.scale = 0.1;

              CAEmitterCell *burst = [CAEmitterCell emitterCell];
              burst.birthRate = 800;
              burst.lifetime = 2.2;
              burst.velocity = 160;
              burst.scale = 0.08;
              burst.scaleSpeed = -0.02;
              burst.alphaSpeed = -0.4;
              burst.spin = 2.0;

              // Tạo danh sách màu sắc pháo hoa rực rỡ
              NSArray *colors = @[
                  (id)[UIColor colorWithRed:1.0 green:0.2 blue:0.5 alpha:1.0].CGColor,
                  (id)[UIColor colorWithRed:1.0 green:0.8 blue:0.2 alpha:1.0].CGColor,
                  (id)[UIColor colorWithRed:0.2 green:0.9 blue:1.0 alpha:1.0].CGColor,
                  (id)[UIColor colorWithRed:0.8 green:0.3 blue:1.0 alpha:1.0].CGColor
              ];

              UIGraphicsBeginImageContext(CGSizeMake(10, 10));
              CGContextRef ctx = UIGraphicsGetCurrentContext();
              CGContextSetFillColorWithColor(ctx, [UIColor whiteColor].CGColor);
              CGContextFillEllipseInRect(ctx, CGRectMake(0, 0, 10, 10));
              UIImage *sparkImg = UIGraphicsGetImageFromCurrentImageContext();
              UIGraphicsEndImageContext();

              burst.contents = (__bridge id)[sparkImg CGImage];
              rocket.emitterCells = @[burst];

              self.fireworksEmitter.emitterCells = @[rocket];
              [self.view.layer addSublayer:self.fireworksEmitter];
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[ThuyLoveViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          ENDOFCODE

          # 3. Biên dịch ứng dụng bằng Clang
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -w \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            main.m -o Payload/SunsetRacer.app/SunsetRacer

          # 4. Đóng gói IPA
          zip -r SunsetRacer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveThuy-MidAutumn-IPA
          path: SunsetRacer.ipa
