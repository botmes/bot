name: Build Love Thuy Mid Autumn IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Package App IPA
        run: |
          mkdir -p Payload/SunsetRacer.app

          # 1. Tạo Info.plist chuẩn iOS Màn Hình Ngang
          python3 -c "
          import plistlib
          plist = {
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleExecutable': 'SunsetRacer',
              'CFBundleIdentifier': 'com.devnvios.lovethuy',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': 'Love Thùy',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': '2.0',
              'CFBundleVersion': '2',
              'LSRequiresIPhoneOS': True,
              'UIRequiresFullScreen': True,
              'UIStatusBarHidden': True,
              'UISupportedInterfaceOrientations': [
                  'UIInterfaceOrientationLandscapeRight',
                  'UIInterfaceOrientationLandscapeLeft'
              ],
              'UIRequiredDeviceCapabilities': ['arm64'],
              'CADisableMinimumFrameDurationOnPhone': True
          }
          with open('Payload/SunsetRacer.app/Info.plist', 'wb') as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_BINARY)
          "

          printf "APPL????" > Payload/SunsetRacer.app/PkgInfo

          # 2. Mã Nguồn Siêu Phẩm: Bút Thần Vẽ Trái Tim, Love Thùy, Lồng Đèn & Pháo Hoa
          cat << 'ENDOFCODE' > main.m
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          @interface MasterpieceViewController : UIViewController
          @property (nonatomic, strong) CAShapeLayer *heartLayer;
          @property (nonatomic, strong) CAShapeLayer *textLayer;
          @property (nonatomic, strong) CAShapeLayer *lanternLayer;
          @property (nonatomic, strong) CAShapeLayer *starLanternLayer;
          @property (nonatomic, strong) UIView *magicPenView;
          @property (nonatomic, strong) CAEmitterLayer *penTrailEmitter;
          @property (nonatomic, strong) CAEmitterLayer *fireworksEmitter;
          @property (nonatomic, strong) UILabel *thuyTitleLabel;
          @property (nonatomic, strong) UILabel *subTitleLabel;
          @property (nonatomic, assign) BOOL isSceneReady;
          @end

          @implementation MasterpieceViewController

          - (BOOL)prefersStatusBarHidden { return YES; }
          - (BOOL)prefersHomeIndicatorAutoHidden { return YES; }
          - (UIInterfaceOrientationMask)supportedInterfaceOrientations {
              return UIInterfaceOrientationMaskLandscape;
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.02 green:0.01 blue:0.06 alpha:1.0];
          }

          - (void)viewDidLayoutSubviews {
              [super viewDidLayoutSubviews];
              if (!self.isSceneReady && self.view.bounds.size.width > self.view.bounds.size.height) {
                  self.isSceneReady = YES;
                  [self setupMasterpieceScene];
              }
          }

          - (void)setupMasterpieceScene {
              CGFloat w = self.view.bounds.size.width;
              CGFloat h = self.view.bounds.size.height;

              // 1. Bầu Trời Đêm & Trăng Tròn Trung Thu phát sáng
              [self createMoonAndStarsWidth:w height:h];

              // 2. Tạo Đường Vẽ 1: Trái Tim Hồng
              UIBezierPath *heartPath = [UIBezierPath bezierPath];
              CGFloat hx = w * 0.28, hy = h * 0.52;
              [heartPath moveToPoint:CGPointMake(hx, hy - 35)];
              [heartPath addCurveToPoint:CGPointMake(hx - 95, hy - 100) controlPoint1:CGPointMake(hx - 50, hy - 95) controlPoint2:CGPointMake(hx - 95, hy - 95)];
              [heartPath addCurveToPoint:CGPointMake(hx, hy + 85) controlPoint1:CGPointMake(hx - 95, hy - 25) controlPoint2:CGPointMake(hx - 30, hy + 50)];
              [heartPath addCurveToPoint:CGPointMake(hx + 95, hy - 100) controlPoint1:CGPointMake(hx + 30, hy + 50) controlPoint2:CGPointMake(hx + 95, hy - 25)];
              [heartPath addCurveToPoint:CGPointMake(hx, hy - 35) controlPoint1:CGPointMake(hx + 95, hy - 95) controlPoint2:CGPointMake(hx + 50, hy - 95)];

              self.heartLayer = [CAShapeLayer layer];
              self.heartLayer.path = heartPath.CGPath;
              self.heartLayer.strokeColor = [UIColor colorWithRed:1.0 green:0.35 blue:0.68 alpha:1.0].CGColor;
              self.heartLayer.fillColor = [UIColor colorWithRed:1.0 green:0.35 blue:0.68 alpha:0.18].CGColor;
              self.heartLayer.lineWidth = 5.0;
              self.heartLayer.lineCap = kCALineCapRound;
              self.heartLayer.lineJoin = kCALineJoinRound;
              self.heartLayer.strokeEnd = 0.0;
              [self.view.layer addSublayer:self.heartLayer];

              // 3. Tạo Đường Vẽ 2: Chữ "love Thùy" uốn lượn nghệ thuật
              UIBezierPath *textPath = [UIBezierPath bezierPath];
              CGFloat tx = w * 0.28, ty = h * 0.50;
              // l
              [textPath moveToPoint:CGPointMake(tx - 65, ty + 10)];
              [textPath addCurveToPoint:CGPointMake(tx - 55, ty - 35) controlPoint1:CGPointMake(tx - 65, ty - 25) controlPoint2:CGPointMake(tx - 55, ty - 35)];
              [textPath addCurveToPoint:CGPointMake(tx - 50, ty + 10) controlPoint1:CGPointMake(tx - 55, ty) controlPoint2:CGPointMake(tx - 50, ty + 10)];
              // o
              [textPath addCurveToPoint:CGPointMake(tx - 30, ty + 10) controlPoint1:CGPointMake(tx - 45, ty - 10) controlPoint2:CGPointMake(tx - 35, ty - 10)];
              // v
              [textPath addCurveToPoint:CGPointMake(tx - 10, ty + 10) controlPoint1:CGPointMake(tx - 25, ty + 20) controlPoint2:CGPointMake(tx - 15, ty + 20)];
              // e
              [textPath addCurveToPoint:CGPointMake(tx + 10, ty + 10) controlPoint1:CGPointMake(tx - 5, ty - 10) controlPoint2:CGPointMake(tx + 5, ty - 10)];
              // T
              [textPath moveToPoint:CGPointMake(tx + 25, ty - 25)];
              [textPath addLineToPoint:CGPointMake(tx + 55, ty - 25)];
              [textPath moveToPoint:CGPointMake(tx + 40, ty - 25)];
              [textPath addLineToPoint:CGPointMake(tx + 40, ty + 15)];
              // h
              [textPath addCurveToPoint:CGPointMake(tx + 55, ty - 15) controlPoint1:CGPointMake(tx + 40, ty - 5) controlPoint2:CGPointMake(tx + 50, ty - 15)];
              [textPath addLineToPoint:CGPointMake(tx + 55, ty + 15)];
              // u
              [textPath addCurveToPoint:CGPointMake(tx + 70, ty + 15) controlPoint1:CGPointMake(tx + 60, ty + 25) controlPoint2:CGPointMake(tx + 70, ty + 25)];
              [textPath addLineToPoint:CGPointMake(tx + 70, ty - 5)];
              [textPath addLineToPoint:CGPointMake(tx + 70, ty + 15)];
              // y
              [textPath addCurveToPoint:CGPointMake(tx + 85, ty + 30) controlPoint1:CGPointMake(tx + 75, ty + 25) controlPoint2:CGPointMake(tx + 85, ty + 25)];

              self.textLayer = [CAShapeLayer layer];
              self.textLayer.path = textPath.CGPath;
              self.textLayer.strokeColor = [UIColor colorWithRed:1.0 green:0.85 blue:0.3 alpha:1.0].CGColor;
              self.textLayer.fillColor = [UIColor clearColor].CGColor;
              self.textLayer.lineWidth = 4.0;
              self.textLayer.lineCap = kCALineCapRound;
              self.textLayer.strokeEnd = 0.0;
              [self.view.layer addSublayer:self.textLayer];

              // 4. Tạo Đường Vẽ 3: Lồng Đèn Đỏ & Lồng Đèn Ông Sao Trung Thu
              UIBezierPath *lanternPath = [UIBezierPath bezierPath];
              CGFloat lx = w * 0.72, ly = h * 0.48;
              // Lồng đèn tròn truyền thống
              [lanternPath moveToPoint:CGPointMake(lx, ly - 70)];
              [lanternPath addLineToPoint:CGPointMake(lx, ly - 50)];
              [lanternPath addCurveToPoint:CGPointMake(lx + 45, ly) controlPoint1:CGPointMake(lx + 40, ly - 50) controlPoint2:CGPointMake(lx + 45, ly - 25)];
              [lanternPath addCurveToPoint:CGPointMake(lx, ly + 50) controlPoint1:CGPointMake(lx + 45, ly + 25) controlPoint2:CGPointMake(lx + 40, ly + 50)];
              [lanternPath addCurveToPoint:CGPointMake(lx - 45, ly) controlPoint1:CGPointMake(lx - 40, ly + 50) controlPoint2:CGPointMake(lx - 45, ly + 25)];
              [lanternPath addCurveToPoint:CGPointMake(lx, ly - 50) controlPoint1:CGPointMake(lx - 45, ly - 25) controlPoint2:CGPointMake(lx - 40, ly - 50)];
              [lanternPath moveToPoint:CGPointMake(lx, ly + 50)];
              [lanternPath addLineToPoint:CGPointMake(lx, ly + 80)]; // Tua rua

              // Lồng đèn ông sao 5 cánh bên cạnh
              CGFloat sx = w * 0.86, sy = h * 0.42;
              for (int i = 0; i < 5; i++) {
                  CGFloat angle = i * 4 * M_PI / 5 - M_PI / 2;
                  CGFloat px = sx + 35 * cos(angle);
                  CGFloat py = sy + 35 * sin(angle);
                  if (i == 0) [lanternPath moveToPoint:CGPointMake(px, py)];
                  else [lanternPath addLineToPoint:CGPointMake(px, py)];
              }
              [lanternPath closePath];

              self.lanternLayer = [CAShapeLayer layer];
              self.lanternLayer.path = lanternPath.CGPath;
              self.lanternLayer.strokeColor = [UIColor colorWithRed:1.0 green:0.25 blue:0.3 alpha:1.0].CGColor;
              self.lanternLayer.fillColor = [UIColor colorWithRed:1.0 green:0.2 blue:0.2 alpha:0.2].CGColor;
              self.lanternLayer.lineWidth = 4.0;
              self.lanternLayer.lineCap = kCALineCapRound;
              self.lanternLayer.strokeEnd = 0.0;
              [self.view.layer addSublayer:self.lanternLayer];

              // 5. Cây Bút Thần Magic Pen
              self.magicPenView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 26, 26)];
              self.magicPenView.backgroundColor = [UIColor colorWithRed:1.0 green:0.95 blue:0.4 alpha:1.0];
              self.magicPenView.layer.cornerRadius = 13;
              self.magicPenView.layer.borderColor = [UIColor whiteColor].CGColor;
              self.magicPenView.layer.borderWidth = 2.5;
              self.magicPenView.layer.shadowColor = [UIColor colorWithRed:1.0 green:0.8 blue:0.2 alpha:1.0].CGColor;
              self.magicPenView.layer.shadowRadius = 12;
              self.magicPenView.layer.shadowOpacity = 1.0;
              self.magicPenView.layer.shadowOffset = CGSizeZero;
              [self.view addSubview:self.magicPenView];

              // Tên "THÙY" Khổng Lồ Phát Sáng (Pháo hoa nổ ra)
              self.thuyTitleLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, h * 0.35, w, 90)];
              self.thuyTitleLabel.text = @"THÙY";
              self.thuyTitleLabel.textColor = [UIColor colorWithRed:1.0 green:0.85 blue:0.2 alpha:1.0];
              self.thuyTitleLabel.font = [UIFont fontWithName:@"HelveticaNeue-CondensedBlack" size:85] ?: [UIFont boldSystemFontOfSize:80];
              self.thuyTitleLabel.textAlignment = NSTextAlignmentCenter;
              self.thuyTitleLabel.layer.shadowColor = [UIColor colorWithRed:1.0 green:0.3 blue:0.7 alpha:1.0].CGColor;
              self.thuyTitleLabel.layer.shadowRadius = 25;
              self.thuyTitleLabel.layer.shadowOpacity = 1.0;
              self.thuyTitleLabel.layer.shadowOffset = CGSizeZero;
              self.thuyTitleLabel.alpha = 0.0;
              [self.view addSubview:self.thuyTitleLabel];

              self.subTitleLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, h * 0.60, w, 40)];
              self.subTitleLabel.text = @"🏮 CHÚC MỪNG TẾT TRUNG THU AN LÀNH 🥮";
              self.subTitleLabel.textColor = [UIColor colorWithRed:1.0 green:0.7 blue:0.4 alpha:1.0];
              self.subTitleLabel.font = [UIFont fontWithName:@"HelveticaNeue-Bold" size:22];
              self.subTitleLabel.textAlignment = NSTextAlignmentCenter;
              self.subTitleLabel.alpha = 0.0;
              [self.view addSubview:self.subTitleLabel];

              // Bắt đầu chuỗi Animation Hoàn Hảo
              [self startMagicPenSequenceHeartPath:heartPath textPath:textPath lanternPath:lanternPath width:w height:h];
          }

          - (void)startMagicPenSequenceHeartPath:(UIBezierPath *)heartPath textPath:(UIBezierPath *)textPath lanternPath:(UIBezierPath *)lanternPath width:(CGFloat)w height:(CGFloat)h {
              
              // Phase 1: Bút vẽ Trái Tim (3s)
              CABasicAnimation *drawHeart = [CABasicAnimation animationWithKeyPath:@"strokeEnd"];
              drawHeart.duration = 3.0;
              drawHeart.fromValue = @(0.0);
              drawHeart.toValue = @(1.0);
              [self.heartLayer addAnimation:drawHeart forKey:@"drawHeart"];
              self.heartLayer.strokeEnd = 1.0;

              CAKeyframeAnimation *penHeart = [CAKeyframeAnimation animationWithKeyPath:@"position"];
              penHeart.path = heartPath.CGPath;
              penHeart.duration = 3.0;
              penHeart.calculationMode = @"paced"; // Đã sửa chuẩn SDK iOS
              [self.magicPenView.layer addAnimation:penHeart forKey:@"penMotion"];

              // Phase 2: Bút viết "love Thùy" (3s)
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(3.1 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  CABasicAnimation *drawText = [CABasicAnimation animationWithKeyPath:@"strokeEnd"];
                  drawText.duration = 3.0;
                  drawText.fromValue = @(0.0);
                  drawText.toValue = @(1.0);
                  [self.textLayer addAnimation:drawText forKey:@"drawText"];
                  self.textLayer.strokeEnd = 1.0;

                  CAKeyframeAnimation *penText = [CAKeyframeAnimation animationWithKeyPath:@"position"];
                  penText.path = textPath.CGPath;
                  penText.duration = 3.0;
                  penText.calculationMode = @"paced";
                  [self.magicPenView.layer addAnimation:penText forKey:@"penMotion"];
              });

              // Phase 3: Bút vẽ Lồng Đèn Trung Thu (3s)
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(6.2 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  CABasicAnimation *drawLantern = [CABasicAnimation animationWithKeyPath:@"strokeEnd"];
                  drawLantern.duration = 3.0;
                  drawLantern.fromValue = @(0.0);
                  drawLantern.toValue = @(1.0);
                  [self.lanternLayer addAnimation:drawLantern forKey:@"drawLantern"];
                  self.lanternLayer.strokeEnd = 1.0;

                  CAKeyframeAnimation *penLantern = [CAKeyframeAnimation animationWithKeyPath:@"position"];
                  penLantern.path = lanternPath.CGPath;
                  penLantern.duration = 3.0;
                  penLantern.calculationMode = @"paced";
                  [self.magicPenView.layer addAnimation:penLantern forKey:@"penMotion"];
              });

              // Phase 4: Bút thần biến mất -> Bắn Pháo Hoa & Hiện Tên THÙY Rực Rỡ
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(9.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  [UIView animateWithDuration:0.5 animations:^{
                      self.magicPenView.alpha = 0.0;
                  }];

                  [self launchGrandFireworksWidth:w height:h];

                  [UIView animateWithDuration:1.5 animations:^{
                      self.thuyTitleLabel.alpha = 1.0;
                      self.thuyTitleLabel.transform = CGAffineTransformMakeScale(1.1, 1.1);
                      self.subTitleLabel.alpha = 1.0;
                  }];
              });
          }

          - (void)createMoonAndStarsWidth:(CGFloat)w height:(CGFloat)h {
              // Trăng vàng
              UIView *moon = [[UIView alloc] initWithFrame:CGRectMake(w - 130, 20, 85, 85)];
              moon.backgroundColor = [UIColor colorWithRed:1.0 green:0.96 blue:0.8 alpha:1.0];
              moon.layer.cornerRadius = 42.5;
              moon.layer.shadowColor = [UIColor colorWithRed:1.0 green:0.85 blue:0.4 alpha:1.0].CGColor;
              moon.layer.shadowRadius = 30;
              moon.layer.shadowOpacity = 0.95;
              moon.layer.shadowOffset = CGSizeZero;
              [self.view addSubview:moon];
          }

          - (void)launchGrandFireworksWidth:(CGFloat)w height:(CGFloat)h {
              self.fireworksEmitter = [CAEmitterLayer layer];
              self.fireworksEmitter.emitterPosition = CGPointMake(w / 2, h + 10);
              self.fireworksEmitter.emitterSize = CGSizeMake(w, 10);

              CAEmitterCell *rocket = [CAEmitterCell emitterCell];
              rocket.birthRate = 3.0;
              rocket.lifetime = 1.6;
              rocket.velocity = 420;
              rocket.velocityRange = 120;
              rocket.yAcceleration = 130;
              rocket.emissionRange = M_PI / 3;
              rocket.scale = 0.12;

              CAEmitterCell *sparkle = [CAEmitterCell emitterCell];
              sparkle.birthRate = 1500;
              sparkle.lifetime = 2.5;
              sparkle.velocity = 180;
              sparkle.scale = 0.09;
              sparkle.scaleSpeed = -0.02;
              sparkle.alphaSpeed = -0.35;
              sparkle.spin = 3.5;

              UIGraphicsBeginImageContext(CGSizeMake(12, 12));
              CGContextRef ctx = UIGraphicsGetCurrentContext();
              CGContextSetFillColorWithColor(ctx, [UIColor whiteColor].CGColor);
              CGContextFillEllipseInRect(ctx, CGRectMake(0, 0, 12, 12));
              UIImage *sparkImg = UIGraphicsGetImageFromCurrentImageContext();
              UIGraphicsEndImageContext();

              sparkle.contents = (__bridge id)[sparkImg CGImage];
              rocket.emitterCells = @[sparkle];

              self.fireworksEmitter.emitterCells = @[rocket];
              [self.view.layer addSublayer:self.fireworksEmitter];
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[MasterpieceViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          ENDOFCODE

          # 3. Biên dịch ứng dụng bằng Clang
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -w \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            main.m -o Payload/SunsetRacer.app/SunsetRacer

          # 4. Đóng gói IPA
          zip -r SunsetRacer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveThuy-Masterpiece-IPA
          path: SunsetRacer.ipa
